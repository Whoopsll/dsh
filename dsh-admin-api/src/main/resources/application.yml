spring:
  application:
    name: dsh-admin-api
  profiles:
    active: dev
  mvc:
    path-match:
      matching-strategy: ant_path_matcher #解决
  servlet:
    multipart:
      max-file-size: 60485760 # 上传文件大小限定为10M
      max-request-size: 60485760
  mail:
    host: smtp.qq.com #邮件服务器地址
    port: 465 #端口号
    username: 1244353765@qq.com
    password: aklgfsnmoyvigjeb
    default-encoding: UTF-8 #默认编码格式
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory #SSL连接配置

mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  type-aliases-package: com.nh.dsh.admin.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: true # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

server:
  port: 10001
  servlet:
    context-path: /dsh-admin-api

logging:
  config: classpath:log/logback-spring.xml

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.nh.dsh.admin.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    enable: true    #开启密码模式
    username: admin   #用户名
    password: 123456  #密码

#拦截器白名单
auth:
  ignore_urls:
    - /sys/auth/login
    - /sys/auth/captcha
    - /wechat
    - /websocket/**
    - /actuator/**
    - /v3/api-docs/**
    - /webjars/**
    - /swagger/**
    - /swagger-resources/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /doc.html
    - /
    - /**/upload
    - /book/exchange/*


